name: Release

# Builds the self-contained release.zip (vendor included) and attaches it
# to the GitHub release, so Updates-plugin sites can pull it via the
# download_url recorded in releases.json.

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Dev dependencies on purpose: the linters and PHPUnit live there,
      # and a tag must not publish unchecked code.
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Lint PHP
        run: composer lint

      - name: PHPStan
        run: composer phpstan

      - name: Psalm
        run: composer psalm

      - name: PHPUnit
        run: composer test

  package:
    name: Build and attach release.zip
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches pubvana.json semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="$(php -r '$d = json_decode(file_get_contents("pubvana.json"), true); echo $d["semver"];')"
          echo "Tag version: $TAG, manifest semver: $SEMVER"
          if [ "$TAG" != "$SEMVER" ]; then
            echo "::error::Tag $TAG does not match pubvana.json semver $SEMVER"
            exit 1
          fi

      - name: Verify releases.json documents the release
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Every tag (alpha, beta, rc, stable) ships through the updater, so
          # each requires a releases.json entry with a download_url.
          php -r '
            $tag = $argv[1];
            $data = json_decode(file_get_contents("releases.json"), true);
            foreach ($data["releases"] ?? [] as $release) {
                if (($release["version"] ?? null) === $tag) {
                    if (empty($release["download_url"])) {
                        fwrite(STDERR, "releases.json entry for $tag has no download_url" . PHP_EOL);
                        exit(1);
                    }
                    exit(0);
                }
            }
            fwrite(STDERR, "releases.json has no entry for $tag" . PHP_EOL);
            exit(1);
          ' "$TAG"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # Rebuilt from scratch so nothing left on disk (logs, backups, caches)
      # can reach the archive. Only the empty tree with .gitkeep ships.
      - name: Build empty writable tree
        run: |
          rm -rf writable
          for dir in cache logs backups updates tmp; do
            mkdir -p "writable/$dir"
            touch "writable/$dir/.gitkeep"
          done

      - name: Build release.zip
        run: |
          zip -r release.zip \
            app public vendor plugins themes writable \
            pubvana.json releases.json CHANGELOG.md README.md ACCESSIBILITY.md \
            LICENSE SECURITY.md CODE_OF_CONDUCT.md CONTRIBUTING.md \
            .env.example .htaccess pubvana cron \
            composer.json composer.lock nginx.conf.sample \
            -x "*.DS_Store"

      # zip exits 0 on a name it could not match, so a renamed path would
      # otherwise publish a broken archive.
      - name: Verify release.zip contents
        run: |
          LIST="$(unzip -Z1 release.zip)"
          failed=0

          for path in \
            app/ public/ vendor/ plugins/ themes/ cron/ \
            writable/cache/.gitkeep writable/logs/.gitkeep \
            writable/backups/.gitkeep writable/updates/.gitkeep \
            writable/tmp/.gitkeep \
            pubvana.json releases.json composer.json composer.lock \
            .env.example .htaccess pubvana
          do
            if ! grep -qxF "$path" <<< "$LIST"; then
              echo "::error::release.zip is missing $path"
              failed=1
            fi
          done

          stray="$(grep '^writable/' <<< "$LIST" | grep -v '/$' | grep -v '\.gitkeep$' || true)"
          if [ -n "$stray" ]; then
            echo "::error::release.zip contains unexpected writable files:"
            echo "$stray"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Attach release.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
