name: Psalm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  psalm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run Psalm (taint analysis)
        run: vendor/bin/psalm --no-progress --taint-analysis --report=psalm.sarif

      - name: Upload SARIF
        if: always() && hashFiles('psalm.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psalm.sarif
          category: psalm
